name: DreamCoder CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Run permission and backup tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_permissions.py -q
          pytest tests/test_backup_manager.py -q

      - name: Syntax checks
        run: |
          python -m py_compile $(find backend -name '*.py')
          node --check frontend/app.js
