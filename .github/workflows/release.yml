name: DreamCoder Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: nsis
          - os: macos-latest
            target: dmg
          - os: ubuntu-latest
            target: AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build backend executable
        working-directory: backend
        shell: bash
        run: |
          python -m pip install -r ../requirements.txt pyinstaller
          pyinstaller --onefile --name dreamcoder-backend main.py
          mkdir -p ../electron/backend-dist
          cp dist/dreamcoder-backend* ../electron/backend-dist/
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install dependencies
        working-directory: electron
        run: npm install
      - name: Build signed installer
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.target == 'dmg' && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --${{ matrix.target }} --publish never
      - name: Hash release artifacts
        shell: bash
        run: |
          find electron/dist -type f -print0 | sort -z | xargs -0 sha256sum > electron/dist/SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: electron/dist/*
      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron/dist/**
          generate_release_notes: true

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install E2E tooling
        working-directory: electron
        run: npm install
      - name: Browser
        working-directory: electron
        run: npx playwright install chromium --with-deps
      - name: Smoke
        working-directory: electron
        run: npm run e2e
