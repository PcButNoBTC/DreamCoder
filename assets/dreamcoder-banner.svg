    <g transform="translate(445 274)"><circle r="25" fill="#0B2140" stroke="#16DFFF"/><text y="8" fill="#16DFFF" font-size="25">✦</text><text y="58" fill="#E5F0FF" font-size="16" font-weight="700">GENERATE</text></g>
    <g transform="translate(620 274)"><circle r="25" fill="#0B2140" stroke="#4B8DFF"/><text y="8" fill="#4B8DFF" font-size="23">&lt;/&gt;</text><text y="58" fill="#E5F0FF" font-size="16" font-weight="700">BUILD</text></g>
