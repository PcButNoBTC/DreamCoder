    <path d="M-14 72c29-38 78-61 132-61 53 0 102 22 132 59" fill="none" stroke="#7B4CFF" stroke-width="8" stroke-linecap="round"/>
    <path d="M95 50l7 18 18 7-18 7-7 18-7-18-18-7 18-7 7-18Z" fill="#ECFBFF"/>
