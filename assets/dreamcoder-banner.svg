<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="420" viewBox="0 0 1280 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DreamCoder — AI-native development studio</title>
  <desc id="desc">DreamCoder branding banner showing the D orbital logo, product name, and generate build test repair ship workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020817"/><stop offset=".55" stop-color="#07152D"/><stop offset="1" stop-color="#100826"/>
    </linearGradient>
    <linearGradient id="word" x1="430" y1="190" x2="870" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17DFFF"/><stop offset=".5" stop-color="#348CFF"/><stop offset="1" stop-color="#A13DFF"/>
    </linearGradient>
    <linearGradient id="logo" x1="60" y1="70" x2="250" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16E0FF"/><stop offset=".5" stop-color="#1687FF"/><stop offset="1" stop-color="#8B3DFF"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-50%" width="160%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <ellipse cx="640" cy="395" rx="500" ry="90" fill="#5637FF" opacity=".16" filter="url(#soft)"/>
